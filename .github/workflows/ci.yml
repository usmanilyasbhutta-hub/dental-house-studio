name: CI
on:
  push:
  pull_request:
jobs:
  check-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - name: Typecheck, unit tests, validate all briefs
        run: npm run typecheck && npm test && npm run validate -- briefs/examples   # real briefs need local footage/consent that is never in git
      - name: Render + QC every example (proves all three templates still work)
        run: |
          for b in briefs/examples/*.yaml; do npm run make -- "$b"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qc-and-videos
          path: |
            qc/
            out/
          retention-days: 14
